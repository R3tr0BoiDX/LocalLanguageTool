services:
  languagetool:
    image: erikvl87/languagetool:latest
    restart: unless-stopped
    ports:
      - ${LT_BIND:-0.0.0.0}:${LT_PORT:-8010}:8010
    environment:
      langtool_languageModel: /ngrams
      Java_Xms: ${JAVA_XMS:-512m}
      Java_Xmx: ${JAVA_XMX:-2g}
    volumes:
      - ${NGRAMS_DIR:-./ngrams}:/ngrams
